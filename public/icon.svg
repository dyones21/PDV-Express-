    <ellipse cx="90" cy="240" rx="20" ry="16" fill="#B45309" opacity="0.6"/>
    <ellipse cx="210" cy="235" rx="25" ry="18" fill="#92400E" opacity="0.6"/>
    <ellipse cx="300" cy="250" rx="14" ry="10" fill="#92400E" opacity="0.5"/>
