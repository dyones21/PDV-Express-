<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <!-- Shopping Bag / Store POS Icon -->
  <g transform="translate(106, 96)">
    <!-- Bag Handle -->
    <path d="M90 120 C90 50, 210 50, 210 120" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round"/>
    <!-- Bag Body -->
    <rect x="30" y="110" width="240" height="230" rx="36" fill="url(#accentGrad)" stroke="#B45309" stroke-width="8"/>
    <!-- Price Tag / Receipt symbol in bag center -->
    <g transform="translate(110, 180)">
      <circle cx="40" cy="40" r="32" fill="#78350F"/>
      <path d="M30 40 L38 48 L52 32" fill="none" stroke="#FEF3C7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Accent Line -->
    <path d="M60 160 L240 160" stroke="#FEF3C7" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
